name: Android phone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Build the store app for phones (everything except the billing counter)
        run: npm run build:mobile
      - name: Create the Android project
        run: npx cap add android
      - name: App icon and splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0F1B2D' --iconBackgroundColorDark '#0F1B2D' --splashBackgroundColor '#0F1B2D' --splashBackgroundColorDark '#0F1B2D'
      - run: npx cap sync android
      - name: Private release key from GitHub secrets (if set)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > android-signing/release.keystore; echo "release key ready"; else echo "no release key secret — test key will be used"; fi
      - name: Signing setup (private key if present, else the test key)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android-signing.cjs
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ "$APK_KIND" = "release" ]; then ./gradlew assembleRelease --no-daemon; cp app/build/outputs/apk/release/app-release.apk ../DataFlow-Owner.apk; else ./gradlew assembleDebug --no-daemon; cp app/build/outputs/apk/debug/app-debug.apk ../DataFlow-Owner.apk; fi
      - name: Check which key signed the APK
        run: |
          keytool -printcert -jarfile DataFlow-Owner.apk | tee cert.txt
          if [ "$APK_KIND" = "release" ]; then ! grep -q "DataFlow Owner (test signing)" cert.txt; else grep -q "DataFlow Owner (test signing)" cert.txt; fi
          rm -f android-signing/release.keystore
      - uses: actions/upload-artifact@v4
        with: { name: DataFlow-Owner-apk, path: DataFlow-Owner.apk }
      - name: Remove the previous APK from the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release delete-asset owner-app DataFlow-Owner.apk -y -R ${{ github.repository }} || true
      - name: Publish (fixed link, replaced on every build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: owner-app
          name: DataFlow Retail phone app (Android)
          body: DataFlow Retail for Android phones — the full store app except the billing counter. Install DataFlow-Owner.apk (allow "install unknown apps" for your browser or WhatsApp). Connect it with the setup code from the counter (Settings › Cloud sync › Phone app).
          files: DataFlow-Owner.apk
          make_latest: false
